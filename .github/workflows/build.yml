name: Build Every File Explorer

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore EveryFileExplorer.sln -NonInteractive

      - name: Prepare Tao Framework
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $taoDir = 'C:\Program Files (x86)\TaoFramework\bin'
          New-Item -ItemType Directory -Force -Path $taoDir | Out-Null
          Copy-Item 'Libraries\Tao.OpenGl.dll' (Join-Path $taoDir 'Tao.OpenGl.dll') -Force
          Copy-Item 'Libraries\Tao.Platform.Windows.dll' (Join-Path $taoDir 'Tao.Platform.Windows.dll') -Force

      - name: Prepare CI solution
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'EveryFileExplorer.sln'
          $dest = 'EveryFileExplorer.CI.sln'
          $ctgpGuid = '{FBF1CF8A-C8BF-4C27-A6E4-EA360BBDCC89}'
          $lines = Get-Content $source
          $result = New-Object System.Collections.Generic.List[string]
          $skipProject = $false

          foreach ($line in $lines) {
            if (-not $skipProject -and $line -match '^Project\(' -and $line -match '= "CTGP-7",') {
              $skipProject = $true
              continue
            }
            if ($skipProject) {
              if ($line -eq 'EndProject') { $skipProject = $false }
              continue
            }
            if ($line.Contains($ctgpGuid)) { continue }
            $result.Add($line)
          }

          [System.IO.File]::WriteAllLines((Join-Path $env:GITHUB_WORKSPACE $dest), $result, [System.Text.Encoding]::UTF8)
          New-Item -ItemType Directory -Force -Path 'EveryFileExplorer\bin\Debug\Plugins' | Out-Null

      - name: Build application and 3DS plugin
        shell: powershell
        run: |
          msbuild EveryFileExplorer.CI.sln /m "/t:EveryFileExplorer;3DS" /p:Configuration=Release "/p:Platform=Any CPU" /verbosity:minimal

      - name: Collect build output
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifact\EveryFileExplorer'
          $plugins = Join-Path $out 'Plugins'
          New-Item -ItemType Directory -Force -Path $plugins | Out-Null

          $appOut = Join-Path $env:GITHUB_WORKSPACE 'EveryFileExplorer\bin\Release'
          $pluginOut = Join-Path $env:GITHUB_WORKSPACE '3DS\bin\Release'

          if (-not (Test-Path (Join-Path $appOut 'EveryFileExplorer.exe'))) {
            throw 'EveryFileExplorer.exe was not produced.'
          }
          if (-not (Test-Path (Join-Path $pluginOut '3DS.dll'))) {
            throw '3DS.dll was not produced.'
          }

          Copy-Item (Join-Path $appOut '*') $out -Recurse -Force
          Copy-Item (Join-Path $pluginOut '*') $plugins -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EveryFileExplorer-Windows
          path: artifact/EveryFileExplorer
          if-no-files-found: error
