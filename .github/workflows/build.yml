name: Build Every File Explorer

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore EveryFileExplorer.sln -NonInteractive

      - name: Install Tao Framework
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $taoDir = 'C:\Program Files (x86)\TaoFramework\bin'
          New-Item -ItemType Directory -Force -Path $taoDir | Out-Null

          $pkgDir = Join-Path $env:RUNNER_TEMP 'tao'
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null

          nuget install Tao.OpenGl -Version 2.1.0 -OutputDirectory $pkgDir -NonInteractive
          nuget install Tao.Platform.Windows -Version 1.0.0 -OutputDirectory $pkgDir -NonInteractive

          $openGl = Get-ChildItem $pkgDir -Recurse -Filter Tao.OpenGl.dll | Select-Object -First 1
          $platform = Get-ChildItem $pkgDir -Recurse -Filter Tao.Platform.Windows.dll | Select-Object -First 1
          if (-not $openGl) { throw 'Tao.OpenGl.dll was not found after NuGet install.' }
          if (-not $platform) { throw 'Tao.Platform.Windows.dll was not found after NuGet install.' }

          Copy-Item $openGl.FullName (Join-Path $taoDir 'Tao.OpenGl.dll') -Force
          Copy-Item $platform.FullName (Join-Path $taoDir 'Tao.Platform.Windows.dll') -Force

      - name: Prepare legacy output directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path 'EveryFileExplorer\bin\Debug\Plugins' | Out-Null

      - name: Build application
        run: msbuild EveryFileExplorer\EveryFileExplorer.csproj /m /p:Configuration=Release /p:Platform=x86 /p:SolutionDir="${{ github.workspace }}\" /verbosity:minimal

      - name: Build 3DS plugin
        run: msbuild 3DS\3DS.csproj /m /p:Configuration=Release /p:Platform=AnyCPU /p:SolutionDir="${{ github.workspace }}\" /verbosity:minimal

      - name: Collect build output
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifact\EveryFileExplorer'
          $plugins = Join-Path $out 'Plugins'
          New-Item -ItemType Directory -Force -Path $plugins | Out-Null

          $appOut = Join-Path $env:GITHUB_WORKSPACE 'EveryFileExplorer\bin\Release'
          $pluginOut = Join-Path $env:GITHUB_WORKSPACE '3DS\bin\Release'

          if (-not (Test-Path (Join-Path $appOut 'EveryFileExplorer.exe'))) {
            throw 'EveryFileExplorer.exe was not produced.'
          }
          if (-not (Test-Path (Join-Path $pluginOut '3DS.dll'))) {
            throw '3DS.dll was not produced.'
          }

          Copy-Item (Join-Path $appOut '*') $out -Recurse -Force
          Copy-Item (Join-Path $pluginOut '*') $plugins -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EveryFileExplorer-Windows
          path: artifact/EveryFileExplorer
          if-no-files-found: error
